<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AXP Kinematic Hologram</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui">
        <div id="hud-header">
            <h1>AXP KINEMATIC HOLOGRAM <span class="version-tag">[v6.2.1 SaaS]</span></h1>
        </div>

        <div class="control-panel">
            
            <div class="slider-group">
                <label>📁 雲端模型庫</label>
                <select id="model-select">
                    </select>
            </div>

            <div class="slider-group">
                <label>📤 載入其他模型</label>
                <input type="file" id="gltf-upload" accept=".glb,.gltf" multiple class="file-input">
            </div>

            <div class="slider-group" id="speed-group" style="display:none;">
                <label>⚙️ 動態速度 <span id="speed-val" class="digital-val">1.0x</span></label>
                <input type="range" id="speed-slider" min="0.1" max="3.0" step="0.1" value="1.0" oninput="document.getElementById('speed-val').innerText = this.value + 'x'">
            </div>

            <div class="slider-group">
                <label>📐 光學線條銳利度 <span id="line-width-val" class="digital-val">2.0</span></label>
                <input type="range" id="line-width-slider" min="1.0" max="6.0" step="0.5" value="2.0">
            </div>

            <hr class="cyber-divider">

            <div class="prism-box">
                <div class="prism-labels">
                    <span>Base-In (BI) 散開</span>
                    <span>Base-Out (BO) 聚合</span>
                </div>
                <input type="range" id="prism-slider" step="0.1" value="0.0" class="prism-range">
                <div class="prism-footer">
                    <span>當前稜鏡需求量:</span>
                    <strong id="prism-val" class="highlight-val">0.0 Δ (平光)</strong>
                </div>
            </div>

            <hr class="cyber-divider">

            <div class="slider-group">
                <label>👓 濾光鏡模式 (Anaglyph Filter)</label>
                <select id="glasses-select">
                    <option value="rb">🔴 🔵 紅藍眼鏡 (Red/Blue)</option>
                    <option value="rg">🔴 🟢 紅綠眼鏡 (Red/Green)</option>
                </select>
            </div>

            <div class="slider-group">
                <label>🔴 右眼抑制解除強度 <span id="r-val" class="digital-val red-glow">50%</span></label>
                <input type="range" id="red-slider" min="0" max="100" value="50" class="red-track">
            </div>

            <div class="slider-group" id="blue-group">
                <label>🔵 左眼抑制解除強度 <span id="b-val" class="digital-val blue-glow">50%</span></label>
                <input type="range" id="blue-slider" min="0" max="100" value="50" class="blue-track">
            </div>

            <div class="slider-group" id="green-group" style="display: none;">
                <label>🟢 左眼抑制解除強度 <span id="g-val" class="digital-val green-glow">50%</span></label>
                <input type="range" id="green-slider" min="0" max="100" value="50" class="green-track">
            </div>

            <div class="ghosting-box">
                <h4>🎛️ 光學防鬼影 (Crosstalk Cancellation)</h4>
                <div class="slider-group" style="margin-bottom: 0;">
                    <label style="font-size: 12px;">物理漏光補償率 <span id="crosstalk-val" class="digital-val">0%</span></label>
                    <input type="range" id="crosstalk-slider" min="0" max="50" value="0">
                </div>
            </div>

            <div id="loading-text" class="pulse-text" style="margin-top: 20px;">系統初始化中...</div>
            
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>

    <script src="app.js"></script>

</body>
</html>
